[project]
name = "olian"
version = "0.1.0"
description = "Multi-project orchestrator (harness) around Hermes Agent: isolated project agents, RBAC, scrapers, outreach, WhatsApp"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
olian = "olian.cli:main"

[tool.setuptools]
packages = ["olian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
